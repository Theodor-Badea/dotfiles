##### Prefix #####
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# New window in current directory
bind c new-window -c "#{pane_current_path}"

# Alt + 1..9 -> go to window
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Unbind moving to the previous / next windows with ALT + H/L
unbind -n M-h
unbind -n M-l

# Alt+Shift+h / Alt+Shift+l -> change order
bind -n M-H swap-window -t -1
bind -n M-L swap-window -t +1

# Vi mode copy-mode
setw -g mode-keys vi

# New pane with CTRL + SHIFT + T
# bind -n C-S-T new-window -c "#{pane_current_path}"

# Rename window
bind -n M-r command-prompt -I "#W" "rename-window '%%'"

# ----------------------- #
#		Options			  #
# ----------------------- #

# True color
# set-option -sa terminal-overrides ",xterm*:Tc"
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-kitty:RGB"

set -g mouse on

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Open panes in current directory
bind v split-window -v -c "#{pane_current_path}"
bind h split-window -h -c "#{pane_current_path}"

# List of plugins
# TPM
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Vim motions
set -g @plugin 'christoomey/vim-tmux-navigator'

# Theme
# set -g @plugin 'catppuccin/tmux'

# Session persistence
set -g @plugin 'tmux-plugins/tmux-resurrect'

# Auto-save sessions
set -g @plugin 'tmux-plugins/tmux-continuum'

# Continuum - save them every 15 minutes
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Better yank
set -g @plugin 'tmux-plugins/tmux-yank'



# Close window
bind -n M-w kill-window

# New window 
bind -n M-t new-window -c "#{pane_current_path}"

# Last window
bind -n M-Tab last-window

# Kill current pane
bind -n M-q kill-pane

# ------------------ #
#	   DESIGN	     #
# ------------------ #
set -g status-style bg=default

setw -g window-status-format " #[fg=#6c7086]#I #[fg=#bac2de]#W "

setw -g window-status-current-format \
"#[fg=#cba6f7,bold]#I #[fg=#f5c2e7,bold]#W"

set -g status-left "#[fg=#cdd6f4,bold][thm] "
set -g status-right ""





# Initialize TMUX plugin manager 
run '~/.tmux/plugins/tpm/tpm'

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Reloaded ~/.config/tmux/tmux.conf"
